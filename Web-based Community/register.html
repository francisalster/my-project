<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – WasteMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="assets/css/style.css" rel="stylesheet" />
</head>

<body>

  <div class="auth-wrapper">
    <div class="auth-card" style="max-width:480px;">

      <div class="text-center mb-4">
        <i class="bi bi-recycle" style="font-size:3rem; color:var(--primary-color, #2e7d32);"></i>
        <h3 class="fw-bold mt-2 mb-0" style="color:#2e7d32;">Create Account</h3>
        <div class="text-muted" style="font-size:0.85rem;">Register as a Community Resident</div>
      </div>

      <div id="regError" class="alert alert-danger  d-none py-2" role="alert"></div>
      <div id="regSuccess" class="alert alert-success d-none py-2" role="alert"></div>

      <form id="registerForm" novalidate>

        <div class="mb-3">
          <label for="fullName" class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" id="fullName" class="form-control" placeholder="Juan Dela Cruz" required />
          </div>
        </div>

        <div class="mb-3">
          <label for="regEmail" class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" id="regEmail" class="form-control" placeholder="you@example.com" required />
          </div>
        </div>

        <div class="mb-3">
          <label for="phone" class="form-label fw-semibold">Phone Number <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-telephone"></i></span>
            <input type="tel" id="phone" class="form-control" placeholder="09XXXXXXXXX" required />
          </div>
        </div>

        <div class="mb-3">
          <label for="address" class="form-label fw-semibold">Home Address <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-house"></i></span>
            <input type="text" id="address" class="form-control" placeholder="123 Main St, Barangay…" required />
          </div>
        </div>

        <div class="mb-3">
          <label for="regPassword" class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" id="regPassword" class="form-control" placeholder="Min. 6 characters" required />
            <button type="button" class="btn btn-outline-secondary" id="toggleRegPass" tabindex="-1">
              <i class="bi bi-eye" id="toggleRegIcon"></i>
            </button>
          </div>
        </div>

        <div class="mb-4">
          <label for="confirmPassword" class="form-label fw-semibold">Confirm Password <span
              class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required />
          </div>
        </div>

        <button type="submit" class="btn btn-success w-100 fw-semibold" id="registerBtn">
          <i class="bi bi-person-plus me-2"></i>Register
        </button>
      </form>

      <div class="text-center mt-3" style="font-size:0.9rem;">
        Already have an account?
        <a href="index.html" class="text-success fw-semibold text-decoration-none">Login here</a>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>window.ROOT_PATH = './';</script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    DB.init();

    const existing = AUTH.getSession();
    if (existing) AUTH.redirectAfterLogin(existing.role);

    document.getElementById('toggleRegPass').addEventListener('click', function () {
      const input = document.getElementById('regPassword');
      const icon = document.getElementById('toggleRegIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
      }
    });

    document.getElementById('registerForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const errorEl = document.getElementById('regError');
      const successEl = document.getElementById('regSuccess');
      errorEl.classList.add('d-none');
      successEl.classList.add('d-none');

      const name = document.getElementById('fullName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const address = document.getElementById('address').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirm = document.getElementById('confirmPassword').value;

      if (!name || !email || !phone || !address || !password || !confirm) {
        return showError('All fields are required.');
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        return showError('Please enter a valid email address.');
      }

      if (password.length < 6) {
        return showError('Password must be at least 6 characters long.');
      }

      if (password !== confirm) {
        return showError('Passwords do not match.');
      }

      const existing = DB.getUserByEmail(email);
      if (existing) {
        return showError('An account with this email already exists.');
      }

      const btn = document.getElementById('registerBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Registering…';

      setTimeout(function () {
        DB.createUser({
          name,
          email,
          phone,
          address,
          password,
          role: 'resident',
          status: 'active'
        });

        successEl.innerHTML = '<i class="bi bi-check-circle me-2"></i>Account created successfully! Redirecting to login…';
        successEl.classList.remove('d-none');
        document.getElementById('registerForm').reset();

        setTimeout(function () {
          window.location.href = 'index.html';
        }, 2000);
      }, 500);
    });

    function showError(msg) {
      const el = document.getElementById('regError');
      el.innerHTML = '<i class="bi bi-exclamation-circle me-2"></i>' + msg;
      el.classList.remove('d-none');
    }
  </script>
</body>

</html>
