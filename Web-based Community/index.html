<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – WasteMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="assets/css/style.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; }
  </style>
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">

    <!-- Logo & Title -->
    <div class="text-center mb-4">
      <i class="bi bi-recycle" style="font-size:3.2rem; color:var(--primary-color, #2e7d32);"></i>
      <h3 class="fw-bold mt-2 mb-0" style="color:#2e7d32;">WasteMS</h3>
      <div class="text-muted" style="font-size:0.85rem;">Community Waste Management &amp; Monitoring System</div>
    </div>

    <!-- Error Alert -->
    <div id="loginError" class="alert alert-danger d-none py-2" role="alert"></div>

    <!-- Login Form -->
    <form id="loginForm" novalidate>

      <div class="mb-3">
        <label for="emailInput" class="form-label fw-semibold">Email Address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" id="emailInput" class="form-control" placeholder="you@example.com" required />
        </div>
      </div>

      <div class="mb-4">
        <label for="passwordInput" class="form-label fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" id="passwordInput" class="form-control" placeholder="••••••••" required />
          <button type="button" class="btn btn-outline-secondary" id="togglePassword" tabindex="-1">
            <i class="bi bi-eye" id="toggleIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-success w-100 fw-semibold" id="loginBtn">
        <i class="bi bi-box-arrow-in-right me-2"></i>Login
      </button>
    </form>

    <!-- Register link -->
    <div class="text-center mt-3" style="font-size:0.9rem;">
      Don't have an account?
      <a href="register.html" class="text-success fw-semibold text-decoration-none">Register here</a>
    </div>

    <!-- Demo Credentials -->
    <div class="mt-4 p-3 rounded" style="background:#f0fdf4; border:1px solid #bbf7d0; font-size:0.82rem;">
      <div class="fw-semibold mb-1 text-success"><i class="bi bi-info-circle me-1"></i>Demo Credentials</div>
      <div><strong>Admin:</strong> admin@wms.com / admin123</div>
      <div><strong>Personnel:</strong> personnel@wms.com / personnel123</div>
      <div><strong>Resident:</strong> resident@wms.com / resident123</div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>window.ROOT_PATH = './';</script>
<script src="assets/js/db.js"></script>
<script src="assets/js/auth.js"></script>
<script>
  // Initialise DB seed data
  DB.init();

  // If already logged in, redirect
  const existing = AUTH.getSession();
  if (existing) AUTH.redirectAfterLogin(existing.role);

  // --- Password show/hide toggle ---
  document.getElementById('togglePassword').addEventListener('click', function () {
    const input = document.getElementById('passwordInput');
    const icon  = document.getElementById('toggleIcon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.className = 'bi bi-eye-slash';
    } else {
      input.type = 'password';
      icon.className = 'bi bi-eye';
    }
  });

  // --- Login form submit ---
  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();

    const email    = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    const errorEl  = document.getElementById('loginError');
    const btn      = document.getElementById('loginBtn');

    errorEl.classList.add('d-none');
    errorEl.textContent = '';

    if (!email || !password) {
      errorEl.textContent = 'Please enter both email and password.';
      errorEl.classList.remove('d-none');
      return;
    }

    // Disable button to prevent double-click
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Logging in…';

    // Small timeout so the spinner is visible
    setTimeout(function () {
      const result = AUTH.login(email, password);
      if (result.success) {
        AUTH.redirectAfterLogin(result.session.role);
      } else {
        errorEl.textContent = result.message || 'Invalid email or password.';
        errorEl.classList.remove('d-none');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Login';
      }
    }, 400);
  });
</script>
</body>
</html>
